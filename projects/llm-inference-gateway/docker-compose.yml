services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Uncomment for exercise 1.2:
    # environment:
    #   - OLLAMA_NUM_PARALLEL=2

  # Pull the model on first run
  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    restart: "no"
    entrypoint: >
      sh -c "sleep 5 && ollama pull qwen2:0.5b"
    environment:
      - OLLAMA_HOST=ollama:11434

volumes:
  ollama-data:
