[workspace]

[package]
name = "third-party"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

# Rust dependencies for the monorepo. Bazel reads this via crate.from_cargo() in MODULE.bazel.
#
# To add a dependency:
#   1. Add the entry below
#   2. CARGO_BAZEL_REPIN=1 bazel build <your target>  ← updates Cargo.lock and fetches the crate
#
# Reference in BUILD files as @crates//:cratename
# (hyphens become underscores: serde-json → @crates//:serde_json)

[dependencies]
thiserror = "2"
rand = "0.9"
